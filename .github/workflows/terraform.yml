name: Terraform CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.9.0"

      - name: Prepare provider plugin cache
        run: |
          mkdir -p "${RUNNER_TEMP}/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=${RUNNER_TEMP}/terraform-plugin-cache" >> "${GITHUB_ENV}"

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-${{ runner.os }}-1.9-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-1.9-

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize bootstrap without backend
        run: terraform -chdir=terraform/bootstrap init -backend=false

      - name: Validate bootstrap
        run: terraform -chdir=terraform/bootstrap validate -no-color

      - name: Initialize prod without backend
        run: terraform -chdir=terraform/environments/prod init -backend=false

      - name: Validate prod
        run: terraform -chdir=terraform/environments/prod validate -no-color
